[project]
name = "chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for ai-chatbot-ui"
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic-settings>=2.2",
  "sqlmodel>=0.0.16",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "orjson>=3.10",
  "httpx>=0.27",
  "firebase-admin>=6.5",
  "psycopg2-binary>=2.9",
]

[tool.uvicorn]
# Example: uvicorn app.main:app --reload --host 0.0.0.0 --port 3001
